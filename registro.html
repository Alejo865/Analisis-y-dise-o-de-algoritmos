<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Nivora - Crear cuenta</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Barra principal -->
    <header>
        <h1>Nivora</h1>

        <nav>
            <a href="index.html">Aprender</a>
            <a href="practica.html">Práctica</a>
            <a href="progreso.html">Tu progreso</a>
        </nav>
    </header>

    <!-- Formulario para crear una cuenta -->
    <main class="contenedor">

        <div class="formulario">

            <h2>Crear cuenta</h2>

            <p>
                Comienza a aprender Python con Nivora.
            </p>

            <form>

                <label for="nombre">Nombre</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Tu nombre"
                >

                <label for="correo">Correo electrónico</label>
                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="correo@ejemplo.com"
                >

                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    placeholder="Crea una contraseña"
                >

                <label for="confirmar">Confirmar contraseña</label>
                <input
                    type="password"
                    id="confirmar"
                    name="confirmar"
                    placeholder="Repite tu contraseña"
                >

                <button type="submit" class="boton">
                    Crear cuenta
                </button>

            </form>

            <p class="texto-formulario">
                ¿Ya tienes una cuenta?
                <a href="login.html">Iniciar sesión</a>
            </p>

        </div>

    </main>

    <footer>
        <p>Nivora - Universidad Católica de Colombia 2026</p>
    </footer>

</body>
</html>
